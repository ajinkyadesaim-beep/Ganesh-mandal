<!DOCTYPE html>
<html lang="mr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>गणेश उत्सव मंडळ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#fff8f0;--card:#fff;--tx:#2b1b0e;--mu:#7a6650;--ac:#e8590c;--ln:#f0dcc6;--gr:#2f9e44;--rd:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c130b;--card:#2a1d12;--tx:#f7e9d9;--mu:#b9a58e;--ln:#43301e}}
:root[data-theme="dark"]{--bg:#1c130b;--card:#2a1d12;--tx:#f7e9d9;--mu:#b9a58e;--ln:#43301e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Devanagari',system-ui,sans-serif;font-size:15px}
header{background:var(--ac);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:18px;margin:0}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{white-space:nowrap;border:1px solid var(--ln);background:none;color:var(--tx);padding:7px 12px;border-radius:20px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:900px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{text-align:center}.stat b{display:block;font-size:22px}.stat span{color:var(--mu);font-size:13px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
button.b{background:var(--ac);color:#fff;border:0;padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer;margin:3px 3px 3px 0}
button.s{background:none;border:1px solid var(--ln);color:var(--tx);padding:4px 8px;border-radius:6px;font:inherit;cursor:pointer;font-size:13px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
.g{color:var(--gr)}.r{color:var(--rd)}h3{margin:4px 0 8px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
.modal.on{display:flex}.box{background:var(--card);padding:16px;border-radius:14px;max-width:340px;width:100%;text-align:center}
.idc{border:3px solid var(--ac);border-radius:12px;padding:14px;background:#fff;color:#222}
.idc h4{margin:0;color:var(--ac)}.idc .ph{width:70px;height:70px;border-radius:50%;background:#ffe8cc;margin:8px auto;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:var(--ac)}
#qr{display:flex;justify-content:center;margin:10px 0}
@media print{body>*:not(#m2){display:none!important}#m2{position:static;background:none;display:block}#m2 .b,#m2 button{display:none}}
</style></head><body>
<header><div style="display:flex;align-items:center;gap:8px"><img id="lg" alt="" style="display:none;width:38px;height:38px;border-radius:50%;background:#fff;object-fit:cover"><h1 id="ttl">🙏 गणेश उत्सव मंडळ</h1></div><div><button class="s" style="color:#fff;border-color:#fff;display:none" onclick="abtn()" id="ab"></button> <button class="s" style="color:#fff;border-color:#fff" onclick="toggleView()" id="vb">सभासद दृश्य</button></div></header>
<nav id="nav"></nav><main id="app"></main>
<div class="modal" id="m1"><div class="box"><h3>UPI QR कोड</h3><div id="qr"></div><div id="qi"></div><button class="b" onclick="cm()">बंद करा</button></div></div>
<div class="modal" id="m2"><div class="box" id="m2b"></div></div>
<script id="seed" type="application/json">{}</script>
<script>
// >>> Google Apps Script वेब ॲपची URL येथे टाका (Code.gs डिप्लॉय केल्यानंतर) <<<
const API='';
let PIN='',syncMsg='',st=null;
const K='ganeshMandal1';
let db={r:[],e:[],b:[],m:[],ev:[],s:{name:'गणेश उत्सव मंडळ',upi:'',upn:''}};
let seed={};try{seed=JSON.parse(document.getElementById('seed').textContent)||{}}catch(e){}
if(seed.s)db=Object.assign(db,seed);
function loadLocal(){try{const x=localStorage.getItem(K);if(x)db=Object.assign(db,JSON.parse(x))}catch(e){}}
let tab='home',view=false,lock=false,dirty=false,A=null;
if(API){view=true;lock=true}else if(window.claude&&claude.use){view=true;lock=true}else loadLocal();
const T={home:'डॅशबोर्ड',rec:'पावती',exp:'खर्च',book:'पूजा बुकिंग',mem:'सभासद',evt:'कार्यक्रम',set:'सेटिंग'};
const $=id=>document.getElementById(id),v=id=>$(id)?$(id).value.trim():'',n=id=>+v(id)||0;
const rs=x=>'₹'+(+x||0).toLocaleString('en-IN'),tod=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){if(API&&PIN)push();if(!lock){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}dirty=true}render()}
const inc=()=>db.r.reduce((a,x)=>a+x.amt,0)+db.b.reduce((a,x)=>a+x.paid,0)+db.m.reduce((a,x)=>a+(x.paid||0),0);
const exs=()=>db.e.reduce((a,x)=>a+x.amt,0);
const due=()=>db.b.reduce((a,x)=>a+Math.max(0,x.amt-x.paid),0)+db.m.reduce((a,x)=>a+Math.max(0,(x.fee||0)-(x.paid||0)),0);
const VT=['home','exp','mem','evt'];
function toggleView(){view=!view;if(view&&!VT.includes(tab))tab='home';render()}
function go(t){tab=t;render()}
function wa(ph,msg){ph=String(ph||'').replace(/\D/g,'');if(ph.length==10)ph='91'+ph;window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(msg),'_blank')}
function cm(){$('m1').classList.remove('on');$('m2').classList.remove('on')}
function qr(amt){if(!db.s.upi){alert('आधी सेटिंगमध्ये UPI ID टाका');return}
 const u='upi://pay?pa='+encodeURIComponent(db.s.upi)+'&pn='+encodeURIComponent(db.s.upn||db.s.name)+(amt>0?'&am='+amt:'')+'&cu=INR&tn='+encodeURIComponent('Ganeshotsav');
 $('qr').innerHTML='';try{new QRCode($('qr'),{text:u,width:220,height:220})}catch(e){$('qr').textContent='QR लोड झाला नाही (इंटरनेट तपासा)'}
 $('qi').textContent=(amt>0?rs(amt)+' — ':'')+db.s.upi;$('m1').classList.add('on')}
function del(k,i){if(confirm('हटवायचे?')){db[k].splice(i,1);save()}}
function tbl(h,rows){return '<div class="tw"><table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table></div>'}
function render(){
 $('ttl').textContent=(db.s.logo?'':'🙏 ')+db.s.name;$('lg').style.display=db.s.logo?'block':'none';if(db.s.logo)$('lg').src=db.s.logo;document.title=db.s.name;$('vb').textContent=view?'संपादन दृश्य':'सभासद दृश्य';
 if(view&&!VT.includes(tab))tab='home';$('vb').style.display=lock?'none':'';const ks=view?VT:Object.keys(T);
 $('nav').innerHTML=ks.map(k=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${T[k]}</button>`).join('');
 $('ab').style.display=API?'':'none';$('ab').textContent=lock?'🔒 अ‍ॅडमिन':'🚪 बाहेर पडा';
 $('app').innerHTML=(API&&!lock&&syncMsg?`<p style="margin:0 0 8px;font-size:13px">${syncMsg}</p>`:'')+P[tab]();}
const P={
home(){const i=inc(),e=exs(),o=db.m.filter(x=>x.role&&x.role!='कार्यकर्ता');
 const pb=(!view&&A)?`<div class="card"><h3>सभासदांना दाखवा</h3>${dirty?'<p class="r">⚠ प्रकाशित न केलेले बदल आहेत</p>':''}<button class="b" onclick="pub()">📤 सभासदांसाठी अपडेट प्रकाशित करा</button></div>`:'';
 return pb+(db.pubAt?`<p style="color:var(--mu);font-size:13px;margin:0 0 8px">शेवटचे अद्यतन: ${esc(db.pubAt)}</p>`:'')+`<div class="grid">
 <div class="card stat"><b class="g">${rs(i)}</b><span>एकूण जमा</span></div>
 <div class="card stat"><b class="r">${rs(e)}</b><span>एकूण खर्च</span></div>
 <div class="card stat"><b>${rs(i-e)}</b><span>शिल्लक</span></div>
 <div class="card stat"><b style="color:var(--ac)">${rs(due())}</b><span>येणे बाकी</span></div></div>
 <div class="card"><h3>पदाधिकारी</h3>${o.length?tbl(['नाव','पद','फोन'],o.map(x=>[esc(x.name),esc(x.role),esc(x.ph)])):'अजून नोंद नाही'}</div>
 <div class="card"><h3>पुढील कार्यक्रम / मीटिंग</h3>${nextEv()}</div>
 <div class="card"><h3>सभासद: ${db.m.length}</h3>
 <button class="b" onclick="sendSummary()">📲 हिशोब WhatsApp वर पाठवा</button></div>`},
rec(){return `<div class="card"><h3>नवीन पावती</h3><div class="f">
 <input id="rn" placeholder="देणगीदाराचे नाव"><input id="rp" placeholder="मोबाईल" type="tel">
 <input id="ra" placeholder="रक्कम ₹" type="number"><select id="rt"><option>देणगी</option><option>वर्गणी</option><option>जाहिरात</option><option>इतर</option></select>
 <select id="rm"><option>रोख</option><option>UPI</option><option>चेक</option></select></div>
 <button class="b" onclick="addRec()">पावती करा</button><button class="s" onclick="qr(n('ra'))">QR कोड</button></div>
 <div class="card"><h3>पावत्या (${db.r.length})</h3>${tbl(['क्र.','तारीख','नाव','प्रकार','रक्कम',''],db.r.map((x,i)=>[x.no,x.d,esc(x.n),x.t+'/'+x.m,rs(x.amt),`<button class="s" onclick="rcpt(${i})">पाठवा</button> <button class="s" onclick="del('r',${i})">✕</button>`]).reverse())}</div>`},
exp(){return (view?'':`<div class="card"><h3>नवीन खर्च</h3><div class="f">
 <input id="en" placeholder="खर्चाचे कारण"><input id="ea" placeholder="रक्कम ₹" type="number">
 <select id="ec"><option>सजावट</option><option>मूर्ती</option><option>प्रसाद</option><option>मंडप/लाईट</option><option>पूजा साहित्य</option><option>इतर</option></select></div>
 <button class="b" onclick="addExp()">खर्च नोंदवा</button></div>`)+`
 <div class="card"><h3>खर्च: ${rs(exs())}</h3>${tbl(['तारीख','कारण','प्रकार','रक्कम',''],db.e.map((x,i)=>[x.d,esc(x.n),x.c,rs(x.amt),view?'':`<button class="s" onclick="del('e',${i})">✕</button>`]).reverse())}</div>`},
book(){return `<div class="card"><h3>पूजा बुकिंग</h3><div class="f">
 <select id="bp"><option>गणेश अभिषेक</option><option>सहस्र आवर्तन</option><option>सत्य विनायक पूजा</option><option>इतर पूजा</option></select>
 <input id="bn" placeholder="यजमानाचे नाव"><input id="bph" placeholder="मोबाईल" type="tel">
 <input id="bd" type="date" value="${tod()}"><input id="bt" type="time"><input id="ba" placeholder="पूजा रक्कम ₹" type="number"><input id="bv" placeholder="ॲडव्हान्स ₹" type="number"></div>
 <button class="b" onclick="addBook()">बुकिंग करा</button><button class="s" onclick="qr(n('bv')||n('ba'))">QR कोड</button></div>
 <div class="card"><h3>बुकिंग (${db.b.length})</h3>${tbl(['पूजा','यजमान','तारीख','रक्कम','आले','बाकी',''],db.b.map((x,i)=>[x.p,esc(x.n),x.d+' '+(x.t||''),rs(x.amt),rs(x.paid),`<span class="${x.amt>x.paid?'r':'g'}">${rs(Math.max(0,x.amt-x.paid))}</span>`,
 `<button class="s" onclick="payB(${i})">पैसे घेतले</button> <button class="s" onclick="bmsg(${i})">📲</button> <button class="s" onclick="del('b',${i})">✕</button>`]))}</div>`},
mem(){const f=view?'':`<div class="card"><h3>सभासद नोंदणी / फी पावती</h3><div class="f">
 <input id="mn" placeholder="नाव"><input id="mp" placeholder="मोबाईल" type="tel">
 <select id="mr"><option>कार्यकर्ता</option><option>अध्यक्ष</option><option>उपाध्यक्ष</option><option>सचिव</option><option>खजिनदार</option><option>सदस्य</option></select>
 <input id="mf" placeholder="सभासद फी ₹" type="number"></div>
 <button class="b" onclick="addMem()">फी पावती + ओळखपत्र</button></div>`;
 return f+`<div class="card"><h3>सभासद (${db.m.length})</h3>${tbl(['ID','नाव','पद','फोन','फी',''],db.m.map((x,i)=>[x.id,esc(x.name),esc(x.role),view?'':esc(x.ph),rs(x.paid),
 `<button class="s" onclick="idc(${i})">ओळखपत्र</button>`+(view?'':` <button class="s" onclick="editMem(${i})">बदला</button> <button class="s" onclick="del('m',${i})">✕</button>`)]))}</div>`},
evt(){const f=view?'':`<div class="card"><h3>कार्यक्रम / मीटिंग जोडा</h3><div class="f">
 <input id="vt" placeholder="कार्यक्रमाचे नाव"><select id="vk"><option>कार्यक्रम</option><option>मीटिंग</option></select>
 <input id="vd" type="date" value="${tod()}"><input id="vh" type="time"><input id="vp" placeholder="ठिकाण"></div>
 <button class="b" onclick="addEv()">जोडा</button></div>`;
 return f+`<div class="card"><h3>वेळापत्रक</h3>${tbl(['तारीख','वेळ','काय','ठिकाण',''],sortEv().map(([x,i])=>[x.d,x.h||'',esc(x.t)+' ('+x.k+')',esc(x.p),
 `<button class="s" onclick="emsg(${i})">📲</button>`+(view?'':` <button class="s" onclick="del('ev',${i})">✕</button>`)]))||''}</div>`},
set(){return `<div class="card"><h3>मंडळाची माहिती</h3><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">${db.s.logo?`<img src="${db.s.logo}" style="width:60px;height:60px;border-radius:50%;object-fit:cover">`:'<div style="width:60px;height:60px;border-radius:50%;background:var(--ln)"></div>'}<div style="flex:1"><label style="font-size:13px;color:var(--mu)">मंडळाचा लोगो</label><input type="file" accept="image/*" onchange="setLogo(this)">${db.s.logo?'<button class="s" onclick="db.s.logo=\'\';save()">लोगो काढा</button>':''}</div></div><input id="sn" value="${esc(db.s.name)}" placeholder="मंडळाचे नाव">
 <input id="su" value="${esc(db.s.upi)}" placeholder="UPI ID (उदा. mandal@upi)"><input id="sp" value="${esc(db.s.upn)}" placeholder="UPI वरील नाव">
 <input id="sw" value="${esc(db.s.grp||'')}" placeholder="WhatsApp नंबर (सारांश पाठवण्यासाठी)" type="tel">
 <button class="b" onclick="saveSet()">जतन करा</button></div>
 <div class="card"><h3>📲 ॲप इन्स्टॉल करा</h3><p style="color:var(--mu);font-size:13px">मोबाईल: ब्राउझर मेनू → "Add to Home screen". संगणक: Chrome/Edge मध्ये पत्त्याजवळचे इन्स्टॉल चिन्ह. फाईल डाउनलोड करूनही थेट उघडता येते.</p><button class="b" id="ib" style="display:none" onclick="inst()">ॲप इन्स्टॉल करा</button><button class="b" onclick="dl()">ॲप फाईल डाउनलोड करा</button></div><div class="card"><h3>बॅकअप</h3><p style="color:var(--mu)">डेटा याच फोन/ब्राउझरमध्ये साठवला जातो. नियमित बॅकअप घ्या.</p>
 <button class="b" onclick="bk()">बॅकअप डाउनलोड</button><input type="file" id="fi" accept=".json" onchange="rest(this)"></div>`}};
function sortEv(){return db.ev.map((x,i)=>[x,i]).sort((a,b)=>a[0].d.localeCompare(b[0].d))}
function nextEv(){const l=sortEv().filter(([x])=>x.d>=tod()).slice(0,4);return l.length?tbl(['तारीख','वेळ','काय','ठिकाण'],l.map(([x])=>[x.d,x.h||'',esc(x.t),esc(x.p)])):'अजून नोंद नाही'}
function addRec(){if(!v('rn')||n('ra')<=0)return alert('नाव व रक्कम टाका');
 db.r.push({no:db.r.length+1,d:tod(),n:v('rn'),ph:v('rp'),amt:n('ra'),t:v('rt'),m:v('rm')});save();rcpt(db.r.length-1)}
function rcpt(i){const x=db.r[i];wa(x.ph,`🙏 ${db.s.name}\nपावती क्र. ${x.no}\nतारीख: ${x.d}\nनाव: ${x.n}\nरक्कम: ${rs(x.amt)} (${x.t}, ${x.m})\nधन्यवाद! गणपती बाप्पा मोरया!`)}
function addExp(){if(!v('en')||n('ea')<=0)return alert('कारण व रक्कम टाका');db.e.push({d:tod(),n:v('en'),amt:n('ea'),c:v('ec')});save()}
function addBook(){if(!v('bn')||n('ba')<=0)return alert('यजमान व रक्कम टाका');
 db.b.push({p:v('bp'),n:v('bn'),ph:v('bph'),d:v('bd'),t:v('bt'),amt:n('ba'),paid:Math.min(n('bv'),n('ba'))});save()}
function payB(i){const x=db.b[i],r=x.amt-x.paid;if(r<=0)return;const a=+prompt('किती रक्कम मिळाली? (बाकी '+r+')',r);if(a>0){x.paid=Math.min(x.amt,x.paid+a);save()}}
function bmsg(i){const x=db.b[i];wa(x.ph,`🙏 ${db.s.name}\n${x.p} बुकिंग निश्चित\nयजमान: ${x.n}\nतारीख: ${x.d} ${x.t||''}\nरक्कम: ${rs(x.amt)}, मिळाले: ${rs(x.paid)}, बाकी: ${rs(x.amt-x.paid)}`)}
function addMem(){if(!v('mn'))return alert('नाव टाका');const id='GM'+String(db.m.length+1).padStart(3,'0');
 db.m.push({id,name:v('mn'),ph:v('mp'),role:v('mr'),fee:n('mf'),paid:n('mf'),d:tod()});save();idc(db.m.length-1)}
function idc(i){const x=db.m[i];$('m2b').innerHTML=`<div class="idc">${db.s.logo?`<img src="${db.s.logo}" style="width:50px;height:50px;border-radius:50%;object-fit:cover"><br>`:''}<h4>${db.s.logo?'':'🙏 '}${esc(db.s.name)}</h4><small>सभासद ओळखपत्र</small>${x.photo?`<img class="ph" src="${x.photo}" style="object-fit:cover;display:block">`:`<div class="ph">${esc(x.name[0])}</div>`}
 <b>${esc(x.name)}</b><br>${esc(x.role)}<br>ID: ${x.id}<br>${x.ph?'मोबाईल: '+esc(x.ph)+'<br>':''}<small>फी: ${rs(x.paid)} | ${x.d}</small></div>
 <button class="b" onclick="window.print()">🖨 प्रिंट</button>${view?'':`<button class="b" onclick="wa('${esc(x.ph)}','🙏 ${esc(db.s.name)}\\nसभासद ID: ${x.id}\\nनाव: ${esc(x.name)}\\nपद: ${esc(x.role)}\\nफी: ${rs(x.paid)} जमा. धन्यवाद!')">📲 WhatsApp</button>`}${view?'':`<button class="s" onclick="editMem(${i})">फोटो/पद बदला</button> `}<button class="s" onclick="cm()">बंद</button>`;$('m2').classList.add('on')}
const ROLES=['कार्यकर्ता','अध्यक्ष','उपाध्यक्ष','सचिव','खजिनदार','सदस्य'];
function editMem(i){const x=db.m[i];$('m2b').innerHTML=`<h3>${x.id} — माहिती बदला</h3>
 ${x.photo?`<img src="${x.photo}" style="width:90px;height:90px;border-radius:50%;object-fit:cover">`:''}
 <input type="file" accept="image/*" onchange="setPhoto(this,${i})">
 <input id="en1" value="${esc(x.name)}" placeholder="नाव"><input id="ep1" value="${esc(x.ph)}" placeholder="मोबाईल" type="tel">
 <select id="er1">${ROLES.map(o=>`<option ${o==x.role?'selected':''}>${o}</option>`).join('')}</select>
 <button class="b" onclick="saveMem(${i})">जतन करा</button><button class="s" onclick="cm()">बंद</button>`;$('m2').classList.add('on')}
function setPhoto(el,i){const f=el.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const c=document.createElement('canvas'),m=Math.min(im.width,im.height),z=160;c.width=c.height=z;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);db.m[i].photo=c.toDataURL('image/jpeg',.85);URL.revokeObjectURL(u);save();editMem(i)};im.src=u}
function saveMem(i){const x=db.m[i];x.name=v('en1')||x.name;x.ph=v('ep1');x.role=v('er1');save();idc(i)}
function addEv(){if(!v('vt'))return alert('नाव टाका');db.ev.push({t:v('vt'),k:v('vk'),d:v('vd'),h:v('vh'),p:v('vp')});save()}
function emsg(i){const x=db.ev[i];wa(db.s.grp,`🙏 ${db.s.name}\n${x.k}: ${x.t}\nतारीख: ${x.d} ${x.h||''}\nठिकाण: ${x.p||'-'}`)}
function sendSummary(){wa(db.s.grp,`🙏 ${db.s.name} — हिशोब\nएकूण जमा: ${rs(inc())}\nएकूण खर्च: ${rs(exs())}\nशिल्लक: ${rs(inc()-exs())}\nयेणे बाकी: ${rs(due())}`)}
function saveSet(){db.s=Object.assign(db.s,{name:v('sn')||'गणेश उत्सव मंडळ',upi:v('su'),upn:v('sp'),grp:v('sw')});save()}
function setLogo(el){const f=el.files[0];if(!f)return;const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const c=document.createElement('canvas'),m=Math.min(im.width,im.height),z=200;c.width=c.height=z;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);db.s.logo=c.toDataURL('image/jpeg',.85);URL.revokeObjectURL(u);save()};im.src=u}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([build(false)],{type:'text/html'}));a.download='ganesh-mandal.html';a.click()}
let dp=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;const b=$('ib');if(b)b.style.display='inline-block'});
function inst(){if(dp){dp.prompt();dp=null}}
if(db.s.name==='गणेश उत्सव मंडळ'&&!db.s.logo&&!db.r.length)tab='set';
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='mandal-backup.json';a.click()}
function rest(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save()}catch(e){alert('फाईल चुकीची')}};r.readAsText(f)}
function build(strip){const c=document.documentElement.cloneNode(true);
 ['app','nav','qr','qi','m2b'].forEach(i=>{c.querySelector('#'+i).innerHTML=''});
 c.querySelectorAll('.modal').forEach(m=>m.classList.remove('on'));
 const lg=c.querySelector('#lg');lg.removeAttribute('src');lg.style.display='none';
 const d=JSON.parse(JSON.stringify(db));
 if(strip){d.r.forEach(x=>delete x.ph);d.b.forEach(x=>delete x.ph);d.m.forEach(x=>delete x.ph);delete d.s.grp}
 c.querySelector('#seed').textContent=JSON.stringify(d).replace(/</g,'\\u003c');
 return '<!DOCTYPE html>\n'+c.outerHTML}
async function pub(){if(!A)return;db.pubAt=new Date().toLocaleString('mr-IN');
 try{await A.publish(build(true));dirty=false;try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}catch(e){if(!(e&&e.code==='conflict'))alert('प्रकाशित झाले नाही: '+((e&&(e.code||e.message))||e))}}
async function boot(){try{const u=await claude.use('user');A=await claude.use('artifact');
 if(u&&u.canEdit&&u.canEdit()&&A){view=false;lock=false;loadLocal()}}catch(e){}render()}
function abtn(){lock?adminLogin():adminOut()}
async function apiPost(o){const r=await fetch(API,{method:'POST',body:JSON.stringify(o)});return r.json()}
async function apiGet(){try{const r=await fetch(API+'?t='+Date.now());const d=await r.json();if(d&&d.s)db=Object.assign(db,d)}catch(e){}render()}
async function adminLogin(){const p=prompt('अ‍ॅडमिन पिन टाका');if(!p)return;try{const d=await apiPost({a:'read',pin:p});if(d.err)return alert('चुकीचा पिन');PIN=p;if(d.data&&d.data.s)db=Object.assign(db,d.data);view=false;lock=false;syncMsg='';render()}catch(e){alert('कनेक्ट होत नाही, इंटरनेट/URL तपासा')}}
function adminOut(){PIN='';lock=true;view=true;apiGet()}
function push(){clearTimeout(st);syncMsg='⏳ जतन होत आहे…';st=setTimeout(async()=>{try{const d=await apiPost({a:'save',pin:PIN,data:db});syncMsg=d.err?'❌ जतन झाले नाही':'✅ सर्वांसाठी जतन झाले '+new Date().toLocaleTimeString('mr-IN')}catch(e){syncMsg='❌ इंटरनेट तपासा'}render()},800)}
render();
if(API){apiGet();setInterval(()=>{if(lock)apiGet()},60000)}else if(lock)boot();
</script></body></html>
